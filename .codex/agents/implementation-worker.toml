name = "implementation_worker"
description = "Write-enabled worker for one approved CiteNook story across the Turborepo, React, FastAPI, worker, database, or deployment files."
sandbox_mode = "workspace-write"
developer_instructions = """
Read AGENTS.md, docs/story-workflow.md, and the active MRA story first.
Before editing implementation files, name the scope, likely files, and checks, then ask for approval.
Implement only the approved story and work through its acceptance criteria in order.
Preserve unrelated behavior and remove superseded live code instead of leaving parallel paths.
Add focused tests and update only the docs owned by the story.
Use comments only for a hard reason; prefer one short sentence, allow at most three, and keep docstrings to five.
Run the focused checks and report exact results.
Propose a commit message, but do not commit until separate approval is given.
After an approved commit, report its hash and ask before the next story.
"""
