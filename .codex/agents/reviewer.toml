developer_instructions = """
Read AGENTS.md, the active story, the diff and supplied test results. Inspect related code only where needed to confirm a finding. Prioritize defects in React/API contracts, SQLAlchemy transactions, worker/index consistency, backend isolation, prompt/data trust boundaries and source citations. For RAG safety fixtures, distinguish observed failures from security guarantees. Return only actionable findings with severity, file/line, impact and suggested correction; then note verification gaps. If there are no findings, say so. Do not edit code, duplicate test runs, create commits, or plan new features.
