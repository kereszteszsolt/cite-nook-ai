name: Checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      UV_LOCKED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install repository npm version
        run: npm install --global npm@11.16.0

      - name: Install locked npm dependencies
        run: npm ci

      - name: Install locked Python dependencies
        working-directory: apps/api
        run: uv sync --locked --extra llamaindex

      - name: Verify repository
        run: python3 .agents/skills/release-evidence/scripts/verify_repository.py

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
