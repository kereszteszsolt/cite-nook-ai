[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citenook-api"
version = "0.1.0"
description = "Local document question-answering API and worker for CiteNook AI."
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
  "ollama==0.6.2",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.4",
  "pypdf==6.16.1",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
]

[project.optional-dependencies]
framework-evaluation = [
  "llama-index-core==0.14.24",
  "llama-index-embeddings-ollama==0.9.0",
  "llama-index-llms-ollama==0.10.1",
]

[project.scripts]
citenook-llamaindex = "app.evaluation.llamaindex_compare:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.setuptools.packages.find]
include = ["app*"]
