name: citenook

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cite_nook:checked-in-development-only@postgres:5432/cite_nook}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
  CHAT_MODELS: ${CHAT_MODELS:-llama3.1:8b,qwen3.5:9b}
  EMBEDDING_MODELS: ${EMBEDDING_MODELS:-qwen3-embedding:0.6b,embeddinggemma}
  DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1:8b}
  DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  INGESTION_STALE_MINUTES: ${INGESTION_STALE_MINUTES:-15}
  CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-12}
  RAG_TOP_K: ${RAG_TOP_K:-5}
  BRAND_CONFIG_PATH: /config/brand.json
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cite_nook}
      POSTGRES_USER: ${POSTGRES_USER:-cite_nook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checked-in-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cite_nook} -d ${POSTGRES_DB:-cite_nook}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
