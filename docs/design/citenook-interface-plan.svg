<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">CiteNook interface design plan</title>
  <desc id="description">A design handoff board showing the CiteNook desktop grounded chat, mobile information hierarchy, brand tokens, user flow, and privacy notes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#20453d" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1d2925; }
      .muted { fill: #66736e; }
      .accent { fill: #20453d; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: .8px; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .inverse { fill: #fffdf8; }
      .inverse-muted { fill: #dcebe6; }
      .frame { fill: #fffdf8; stroke: #d9ddd7; stroke-width: 1.5; }
      .soft { fill: #f5f3ed; }
      .active { fill: #dcebe6; stroke: #315c52; stroke-width: 1.2; }
      .line { stroke: #d9ddd7; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f5f3ed"/>
  <text x="60" y="70" class="eyebrow accent">MRA-017 · DESIGN HANDOFF</text>
  <text x="60" y="122" font-size="42" font-weight="750">CiteNook interface plan</text>
  <text x="60" y="154" class="body muted">Local document Q&amp;A with citations · current product baseline · desktop + mobile</text>

  <g transform="translate(1115 42)">
    <text x="0" y="18" class="label muted">CORE TOKENS</text>
    <g transform="translate(0 34)">
      <rect width="116" height="64" rx="12" fill="#315c52"/>
      <text x="12" y="26" class="small inverse">Accent</text>
      <text x="12" y="47" class="small inverse">#315C52</text>
    </g>
    <g transform="translate(130 34)">
      <rect width="116" height="64" rx="12" fill="#20453d"/>
      <text x="12" y="26" class="small inverse">Strong</text>
      <text x="12" y="47" class="small inverse">#20453D</text>
    </g>
    <g transform="translate(260 34)">
      <rect width="116" height="64" rx="12" fill="#dcebe6" stroke="#d9ddd7"/>
      <text x="12" y="26" font-size="12">Soft</text>
      <text x="12" y="47" font-size="12">#DCEBE6</text>
    </g>
    <g transform="translate(390 34)">
      <rect width="116" height="64" rx="12" fill="#fffdf8" stroke="#d9ddd7"/>
      <text x="12" y="26" font-size="12">Surface</text>
      <text x="12" y="47" font-size="12">#FFFDF8</text>
    </g>
    <g transform="translate(520 34)">
      <rect width="116" height="64" rx="12" fill="#1d2925"/>
      <text x="12" y="26" class="small inverse">Text</text>
      <text x="12" y="47" class="small inverse">#1D2925</text>
    </g>
  </g>

  <text x="60" y="207" class="label muted">DESKTOP · GROUNDED CHAT</text>
  <g transform="translate(60 228)" filter="url(#shadow)">
    <rect width="1000" height="620" rx="22" class="frame"/>
    <line x1="0" y1="58" x2="1000" y2="58" class="line"/>
    <text x="28" y="27" font-size="18" font-weight="700">CiteNook</text>
    <text x="28" y="45" class="small muted">Local document Q&amp;A with citations</text>
    <rect x="842" y="16" width="130" height="28" rx="14" fill="#e8f3ef" stroke="#bfd9cf"/>
    <circle cx="858" cy="30" r="4" fill="#315c52"/>
    <text x="869" y="34" class="small accent">Ollama connected</text>

    <rect x="0" y="58" width="1000" height="48" fill="#fffdf8"/>
    <text x="32" y="88" class="body accent" font-weight="700">Chat</text>
    <text x="112" y="88" class="body muted">Documents</text>
    <rect x="24" y="103" width="70" height="3" fill="#315c52"/>

    <rect x="22" y="126" width="228" height="472" rx="16" class="frame"/>
    <rect x="38" y="142" width="196" height="42" rx="9" fill="#315c52"/>
    <text x="136" y="168" class="inverse" font-size="14" text-anchor="middle">New conversation</text>
    <rect x="38" y="198" width="196" height="76" rx="10" class="active"/>
    <text x="52" y="222" class="body">Neighborhood energy brief</text>
    <text x="52" y="243" class="small muted">qwen3.5:9b</text>
    <text x="52" y="260" class="small muted">qwen3-embedding:0.6b</text>
    <text x="52" y="305" class="body">Community garden handbook</text>
    <text x="52" y="326" class="small muted">llama3.1:8b</text>
    <text x="52" y="365" class="body">Local transit survey</text>
    <text x="52" y="386" class="small muted">qwen3.5:9b</text>

    <rect x="270" y="126" width="708" height="104" rx="16" class="frame"/>
    <text x="294" y="164" font-size="25" font-weight="700">Neighborhood energy brief</text>
    <rect x="294" y="181" width="172" height="31" rx="9" class="soft"/>
    <text x="307" y="201" class="small muted">Chat model</text>
    <text x="377" y="201" class="small">qwen3.5:9b</text>
    <rect x="476" y="181" width="232" height="31" rx="9" class="soft"/>
    <text x="489" y="201" class="small muted">Embedding model</text>
    <text x="585" y="201" class="small">qwen3-embedding:0.6b</text>
    <text x="820" y="165" class="small accent">Edit models</text>
    <text x="900" y="165" class="small" fill="#9f2d25">Delete</text>

    <rect x="270" y="248" width="708" height="350" rx="16" class="frame"/>
    <rect x="514" y="270" width="430" height="72" rx="14" class="active"/>
    <text x="534" y="294" class="small accent">YOU</text>
    <text x="534" y="320" class="body">What reduces evening grid demand?</text>

    <rect x="300" y="360" width="610" height="166" rx="14" fill="#f5f3ed" stroke="#d9ddd7"/>
    <text x="320" y="386" class="small accent">CITENOOK</text>
    <text x="835" y="386" class="small muted">qwen3.5:9b</text>
    <text x="320" y="413" class="body">Shift flexible loads to midday solar output.</text>
    <text x="320" y="436" class="body">Battery storage then covers the evening peak [S1].</text>
    <line x1="320" y1="454" x2="890" y2="454" class="line"/>
    <text x="320" y="478" class="small" font-weight="700">REFERENCES</text>
    <text x="320" y="501" class="small accent">[S1] neighborhood-energy-brief.pdf · page 4 · 89.2%</text>

    <rect x="300" y="542" width="648" height="42" rx="16" fill="#fffdf8" stroke="#d9ddd7"/>
    <text x="320" y="568" class="body muted">Ask a question grounded in your ready documents…</text>
    <circle cx="920" cy="563" r="15" fill="#315c52"/>
    <path d="M914 563h12m-6-6 6 6-6 6" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1100" y="207" class="label muted">MOBILE · SAME INFORMATION HIERARCHY</text>
  <g transform="translate(1100 228)" filter="url(#shadow)">
    <rect width="390" height="620" rx="30" class="frame"/>
    <text x="22" y="32" font-size="17" font-weight="700">CiteNook</text>
    <rect x="22" y="48" width="124" height="25" rx="13" fill="#e8f3ef" stroke="#bfd9cf"/>
    <circle cx="36" cy="60" r="4" fill="#315c52"/>
    <text x="47" y="64" class="small accent">Ollama connected</text>
    <line x1="0" y1="86" x2="390" y2="86" class="line"/>
    <text x="96" y="116" class="body accent" font-weight="700">Chat</text>
    <text x="266" y="116" class="body muted">Documents</text>
    <rect x="18" y="132" width="354" height="115" rx="14" class="frame"/>
    <rect x="32" y="146" width="326" height="38" rx="9" fill="#315c52"/>
    <text x="195" y="170" class="inverse" font-size="14" text-anchor="middle">New conversation</text>
    <text x="38" y="211" class="body">Neighborhood energy brief</text>
    <text x="38" y="232" class="small muted">qwen3.5:9b · qwen3-embedding:0.6b</text>
    <rect x="18" y="260" width="354" height="122" rx="14" class="frame"/>
    <text x="34" y="294" font-size="23" font-weight="700">Neighborhood energy brief</text>
    <text x="34" y="327" class="small accent">Edit title</text>
    <rect x="34" y="344" width="170" height="25" rx="8" class="soft"/>
    <text x="45" y="361" class="small">Chat · qwen3.5:9b</text>
    <rect x="18" y="396" width="354" height="202" rx="14" class="frame"/>
    <rect x="54" y="414" width="304" height="58" rx="13" class="active"/>
    <text x="70" y="438" class="small accent">YOU</text>
    <text x="70" y="458" class="small">What reduces evening grid demand?</text>
    <rect x="34" y="486" width="304" height="70" rx="13" fill="#f5f3ed" stroke="#d9ddd7"/>
    <text x="50" y="509" class="small accent">CITENOOK</text>
    <text x="50" y="531" class="small">Shift flexible loads to midday solar.</text>
    <text x="50" y="550" class="small accent">[S1] energy brief · page 4</text>
    <rect x="34" y="566" width="304" height="22" rx="10" fill="#fffdf8" stroke="#d9ddd7"/>
  </g>

  <g transform="translate(1530 228)">
    <text x="0" y="0" class="label muted">DESIGN PRINCIPLES</text>
    <g transform="translate(0 28)">
      <circle cx="15" cy="15" r="15" fill="#dcebe6"/><text x="15" y="20" text-anchor="middle" font-size="14" font-weight="700">1</text>
      <text x="42" y="13" class="body" font-weight="700">Grounding first</text>
      <text x="42" y="34" class="small muted">Answers keep sources</text>
      <text x="42" y="51" class="small muted">visible and inspectable.</text>
    </g>
    <g transform="translate(0 108)">
      <circle cx="15" cy="15" r="15" fill="#dcebe6"/><text x="15" y="20" text-anchor="middle" font-size="14" font-weight="700">2</text>
      <text x="42" y="13" class="body" font-weight="700">Local clarity</text>
      <text x="42" y="34" class="small muted">API and Ollama states</text>
      <text x="42" y="51" class="small muted">name the real boundary.</text>
    </g>
    <g transform="translate(0 188)">
      <circle cx="15" cy="15" r="15" fill="#dcebe6"/><text x="15" y="20" text-anchor="middle" font-size="14" font-weight="700">3</text>
      <text x="42" y="13" class="body" font-weight="700">Safe lifecycle</text>
      <text x="42" y="34" class="small muted">Deactivate is distinct</text>
      <text x="42" y="51" class="small muted">from confirmed deletion.</text>
    </g>
    <g transform="translate(0 268)">
      <circle cx="15" cy="15" r="15" fill="#dcebe6"/><text x="15" y="20" text-anchor="middle" font-size="14" font-weight="700">4</text>
      <text x="42" y="13" class="body" font-weight="700">Responsive parity</text>
      <text x="42" y="34" class="small muted">Mobile preserves the</text>
      <text x="42" y="51" class="small muted">same stored actions.</text>
    </g>
    <rect x="0" y="360" width="220" height="138" rx="14" fill="#fffdf8" stroke="#d9ddd7"/>
    <text x="18" y="388" class="label accent">PRIVACY BOUNDARY</text>
    <text x="18" y="416" class="small muted">Design and screenshots use</text>
    <text x="18" y="435" class="small muted">invented examples only.</text>
    <text x="18" y="464" class="small muted">No personal uploads, live DB,</text>
    <text x="18" y="483" class="small muted">or Ollama response content.</text>
  </g>

  <g transform="translate(60 900)">
    <text x="0" y="0" class="label muted">PRIMARY USER FLOW</text>
    <g transform="translate(0 24)">
      <rect width="250" height="78" rx="15" class="frame"/>
      <text x="22" y="31" class="small muted">01 · DOCUMENTS</text>
      <text x="22" y="56" class="body" font-weight="700">Upload a supported source</text>
    </g>
    <path d="M264 63h42" stroke="#315c52" stroke-width="2"/><path d="m300 57 8 6-8 6" fill="none" stroke="#315c52" stroke-width="2"/>
    <g transform="translate(320 24)">
      <rect width="250" height="78" rx="15" class="frame"/>
      <text x="22" y="31" class="small muted">02 · WORKER</text>
      <text x="22" y="56" class="body" font-weight="700">Wait for ready chunks</text>
    </g>
    <path d="M584 63h42" stroke="#315c52" stroke-width="2"/><path d="m620 57 8 6-8 6" fill="none" stroke="#315c52" stroke-width="2"/>
    <g transform="translate(640 24)">
      <rect width="250" height="78" rx="15" class="frame"/>
      <text x="22" y="31" class="small muted">03 · CHAT</text>
      <text x="22" y="56" class="body" font-weight="700">Ask a focused question</text>
    </g>
    <path d="M904 63h42" stroke="#315c52" stroke-width="2"/><path d="m940 57 8 6-8 6" fill="none" stroke="#315c52" stroke-width="2"/>
    <g transform="translate(960 24)">
      <rect width="250" height="78" rx="15" class="frame"/>
      <text x="22" y="31" class="small muted">04 · ANSWER</text>
      <text x="22" y="56" class="body" font-weight="700">Verify citations and source</text>
    </g>
    <rect x="1250" y="24" width="470" height="78" rx="15" fill="#20453d"/>
    <text x="1274" y="55" class="inverse" font-size="14" font-weight="700">Outcome: an answer is useful only when its evidence is visible.</text>
    <text x="1274" y="78" class="small inverse-muted">Source of truth: packages/brand/brand.json + implemented React UI.</text>
  </g>
</svg>
